<!DOCTYPE html>
<html lang="zh-CN" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#05070f">
<meta name="description" content="武侯Chat · 端到端加密的匿名聊天空间">
<title>武侯Chat · 端到端加密匿名聊天</title>
<!-- 官方图标：浏览器标签 / 桌面快捷方式 -->
<link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png">
<link rel="apple-touch-icon" href="/static/img/icon-128.png">
<link rel="stylesheet" href="/static/css/theme.css?v=20261031">
<link rel="stylesheet" href="/static/css/layout.css?v=20261031">
<link rel="stylesheet" href="/static/css/components.css?v=20261023">
<link rel="stylesheet" href="/static/css/views.css?v=20261023">
<link rel="stylesheet" href="/static/css/premium.css?v=20261023">
<link rel="stylesheet" href="/static/css/depth.css?v=20261023">
<link rel="stylesheet" href="/static/css/aurora.css?v=20261023">
<link rel="stylesheet" href="/static/css/smooth.css?v=20261023">
<link rel="stylesheet" href="/static/css/brand.css?v=20261031">
<!-- 移动端界面系统：与电脑端是两套独立实现，仅在移动端形态生效 -->
<link rel="stylesheet" href="/static/css/mobile.css?v=20261023">
</head>
<body>

<!-- ============================ 启动屏 ============================ -->
<div class="boot" id="boot">
  <img class="boot__logo" src="/static/img/icon-128.png" alt="武侯Chat" width="72" height="72">
  <div class="boot__title">武侯Chat</div>
  <div class="boot__sub">正在建立加密通道…</div>
  <div class="boot__bar"><i></i></div>
</div>

<!-- ============================ 认证 ============================ -->
<section class="auth" id="auth" hidden>
  <div class="auth__bg"></div>
  <!-- 登录页漂浮光点（纯 CSS，轻量） -->
  <div class="auth__particles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <!-- 品牌内容作为背景舞台：不再和表单抢高度 -->
  <aside class="auth__showcase auth__showcase--hero">
      <div class="auth__logo">
        <img src="/static/img/icon-128.png" alt="武侯Chat" width="46" height="46">
      </div>
      <h2 class="auth__title">武侯Chat</h2>
      <p class="auth__lede">一个不说废话的加密聊天空间。内容在离开你的设备之前就已经锁好。</p>
      <ul class="auth__feats">
        <li>
          <span class="auth__feat-ico">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <span><b>全局端到端加密</b><i>统一密钥 AES-256-GCM，服务端只保存密文</i></span>
        </li>
        <li>
          <span class="auth__feat-ico">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.5 8.5 0 0 1 8 8z"/></svg>
          </span>
          <span><b>私聊 / 群聊 / 公共房间</b><i>文件、图片、表情包、语音视频通话</i></span>
        </li>
        <li>
          <span class="auth__feat-ico">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </span>
          <span><b>WAF 与违规词防护</b><i>滑动人机检测 + 实时风险拦截</i></span>
        </li>
      </ul>
      <div class="auth__badges">
        <span class="auth__badge">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
          端到端加密
        </span>
        <span class="auth__badge">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>
          开源可审计
        </span>
        <span class="auth__badge">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
          永久免费
        </span>
      </div>
      <div class="auth__foot">© 2026 左熙宇 · 武侯Chat</div>
  </aside>

  <!-- 登录 / 注册：两张各自独立、可拖拽的卡片 -->
  <div class="auth__desk" id="authDesk">

    <!-- 移动端精简品牌区（仅窄屏显示） -->
    <div class="auth__mobile-brand">
      <div class="auth__logo">
        <img src="/static/img/icon-128.png" alt="武侯Chat">
      </div>
      <h2>武侯Chat</h2>
      <p>一个不说废话的加密聊天空间</p>
    </div>

    <!-- 登录卡片 -->
    <article class="auth-card is-front" id="loginCard" data-card="login">
      <header class="auth-card__bar" id="loginCardBar">
        <span class="auth-card__grip" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="auth-card__title">
          <img src="/static/img/icon-128.png" alt="" width="20" height="20">
          <span>登录武侯Chat</span>
        </span>
        <span class="auth-card__acts">
          <button type="button" class="auth-card__btn auth-card__btn--go" data-to="register">注册 ›</button>
        </span>
      </header>
      <div class="auth-card__body">
        <form class="form" id="loginForm" autocomplete="off">
        <label class="field">
          <span class="field__label">用户名</span>
          <input class="input" name="username" placeholder="字母 / 数字 / _ . -" required>
        </label>
        <label class="field">
          <span class="field__label">密码</span>
          <div class="input-wrap">
            <input class="input" name="password" type="password" placeholder="请输入密码" required>
            <button type="button" class="input-eye" data-eye="password" aria-label="显示密码">👁</button>
          </div>
        </label>
        <div id="loginSecondWrap" hidden>
          <label class="field">
            <span class="field__label">第二层密码</span>
            <input class="input" name="second" type="password" placeholder="该账号开启了二次登录">
          </label>
        </div>
        <div class="field">
          <span class="field__label">滑动人机检测</span>
          <div class="slider" id="sliderLogin"></div>
        </div>
        <div class="form-alert" id="loginErr" role="alert" aria-live="polite" hidden></div>
        <button class="btn btn--primary btn--block" type="submit">进入武侯Chat</button>
        <p class="auth__tip">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          全程加密 · 内容在离开设备前已锁好
        </p>
      </form>
      </div>
    </article>

    <!-- 注册卡片 -->
    <article class="auth-card" id="regCard" data-card="register" hidden>
      <header class="auth-card__bar" id="regCardBar">
        <span class="auth-card__grip" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="auth-card__title">
          <img src="/static/img/icon-128.png" alt="" width="20" height="20">
          <span>注册匿名身份</span>
        </span>
        <span class="auth-card__acts">
          <button type="button" class="auth-card__btn auth-card__btn--go" data-to="login">‹ 登录</button>
        </span>
      </header>
      <div class="auth-card__body">
      <form class="form" id="regForm" autocomplete="off">
        <div class="grid-2">
          <label class="field">
            <span class="field__label">用户名</span>
            <input class="input" name="username" placeholder="3-20 位" required>
          </label>
          <label class="field">
            <span class="field__label">昵称</span>
            <input class="input" name="nickname" placeholder="别人看到的名字" required>
          </label>
        </div>
        <label class="field">
          <span class="field__label">密码</span>
          <div class="input-wrap">
            <input class="input" name="password" type="password" placeholder="至少 8 位" required>
            <button type="button" class="input-eye" data-eye="password" aria-label="显示密码">👁</button>
          </div>
        </label>
        <div class="field field--inline">
          <span class="field__label">头像</span>
          <div class="avatar-picker" id="avatarPicker"></div>
        </div>
        <!-- 年龄 / 性别 / 生日属选填项：收进折叠区，避免把注册卡撑长 -->
        <button type="button" class="field-more" id="regMoreBtn" aria-expanded="false" aria-controls="regMore">
          <span>更多信息（年龄 / 性别 / 生日，选填）</span>
          <svg class="field-more__chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="field-more__wrap" id="regMore">
          <div class="grid-3">
            <label class="field">
              <span class="field__label">年龄</span>
              <input class="input" name="age" type="number" min="0" max="120" placeholder="选填">
            </label>
            <label class="field">
              <span class="field__label">性别</span>
              <select class="input" name="gender">
                <option value="unknown">保密</option>
                <option value="male">男</option>
                <option value="female">女</option>
                <option value="other">其他</option>
              </select>
            </label>
            <label class="field">
              <span class="field__label">生日</span>
              <input class="input" name="birthday" type="date">
            </label>
          </div>
        </div>
        <div class="field">
          <span class="field__label">滑动人机检测</span>
          <div class="slider" id="sliderReg"></div>
        </div>
        <div class="form-alert" id="regErr" role="alert" aria-live="polite" hidden></div>
        <button class="btn btn--primary btn--block" type="submit">创建身份</button>
        <p class="auth__tip">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          注册即接入全局统一密钥加密通道
        </p>
      </form>
      </div>
    </article>
  </div>
</section>

<!-- ============================ 主应用 ============================ -->
<div class="app" id="app" hidden>
  <nav class="rail">
    <div class="rail__top">
      <div class="rail__logo rail__logo--icon" title="武侯Chat"><img src="/static/img/icon-128.png" alt="武侯Chat"></div>
    </div>
    <div class="rail__nav" id="railNav"></div>
    <div class="rail__bottom">
      <button class="rail__btn" id="themeBtn" title="切换主题">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
        <span class="rail__tip">主题</span>
      </button>
    </div>
  </nav>

  <aside class="side" id="side">
    <header class="side__head">
      <div class="searchbar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="globalSearch" placeholder="搜索用户 / 群聊 / 记录 / 动态" autocomplete="off" title="Ctrl+K 快速聚焦">
      </div>
      <button class="icon-btn" id="btnNew" title="发起">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </header>
    <div class="side__body" id="sideBody"></div>
  </aside>

  <main class="main" id="main">
    <div class="main__stage" id="stage"></div>
  </main>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>
<div class="call-root" id="callRoot" hidden></div>
<div class="sheet-root" id="sheetRoot"></div>

<footer class="copyright" id="copyright"></footer>

<script type="module" src="/static/js/app.js?v=20261031"></script>
</body>
</html>
